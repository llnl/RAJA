on: push
name: Build
jobs:
  build_docker:
    strategy:
      matrix:
        target: [gcc12, gcc12_debug, gcc13, gcc13_desul, clang19_debug, clang19_style, clang19_desul, intel2024_2, intel2024_2_debug, intel2024_2_sycl, rocm6_4_3_desul]
    runs-on: ubuntu-latest
    steps:
    - run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        target: ${{ matrix.target }}
  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - uses: threeal/cmake-action@v1.3.0
        with:
          build-dir: build
          options:
            CMAKE_CXX_STANDARD=20
            ENABLE_OPENMP=Off
            CMAKE_BUILD_TYPE=Release
          run-build: true
          build-args: '--parallel 16'
      - uses: threeal/ctest-action@v1.1.0
  build_windows:
    strategy:
      matrix:
        shared: 
        - args: 
            BUILD_SHARED_LIBS=On 
            CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=On
        - args: BUILD_SHARED_LIBS=Off
          
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
## ====================================
## Config and build action
      - uses: threeal/cmake-action@v1.3.0
        with:
          build-dir: build
          options:
            ENABLE_WARNINGS_AS_ERRORS=Off
            BLT_CXX_STD="c++20"
            CMAKE_CXX_STANDARD=20
            CMAKE_BUILD_TYPE=Release
            ${{ matrix.shared.args }}
          run-build: true
          build-args: '--parallel 16'
## ====================================
## Print the contents of the test directory in the build space (debugging)
##    - run: | 
##        dir -r D:\a\RAJA\RAJA\build\test
## ====================================
## Run tests action
      - uses: threeal/ctest-action@v1.1.0
        with:
          build-config: Debug

build_windows_cuda:
  strategy:
    matrix:
      shared:
        - args:
            BUILD_SHARED_LIBS=On
            CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=On
        - args:
            BUILD_SHARED_LIBS=Off

  # Running on Visual Studio 2022 for better CUDA 12 compatibility
  # windows-2025 would be locked to Visual Studio 2026
  # windows-latest can be changed by GitHub
  runs-on: windows-2022

  steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive

    - uses: Jimver/cuda-toolkit@v0.2.35
      with:
        cuda: '12.9.1'
        sub-packages: '["nvcc", "visual_studio_integration", "cudart", "nvrtc", "thrust"]'

    - name: Check CUDA
      shell: pwsh
      run: |
        nvcc --version
        echo "CUDA_PATH=$env:CUDA_PATH"

    - uses: threeal/cmake-action@v1.3.0
      with:
        build-dir: build
        options:
          ENABLE_WARNINGS_AS_ERRORS=Off
          BLT_CXX_STD="c++20"
          CMAKE_CXX_STANDARD=20
          CMAKE_BUILD_TYPE=Release
          CMAKE_CUDA_ARCHITECTURES=70
          CUDA_TOOLKIT_ROOT_DIR="$env{CUDA_PATH}"
          CMAKE_CUDA_COMPILER="$env{CUDA_PATH}/bin/nvcc.exe"
          ENABLE_CUDA=On
          ${{ matrix.shared.args }}
        run-build: true
        build-args: '--parallel 16'
## ====================================
## Print the contents of the test directory in the build space (debugging)
##    - run: | 
##        dir -r D:\a\RAJA\RAJA\build\test
## ====================================
## Run tests action
      - uses: threeal/ctest-action@v1.1.0
        with:
          build-config: Debug