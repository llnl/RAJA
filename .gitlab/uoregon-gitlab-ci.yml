###############################################################################
# VARIABLES
###############################################################################

variables:
  # GIT_STRATEGY: fetch
  # GIT_DEPTH: 1
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_DEPTH: 1
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 3
  GIT_SUBMODULE_PATHS: blt tpl/camp tpl/desul

###############################################################################
# MAIN PIPELINE STAGES
###############################################################################

stages:
  - build-and-test

###############################################################################
# JOBS
###############################################################################

.common-setup:
  stage: build-and-test
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "balos1/add-uoregon-gitlab-ci"'
  variables:
    OMP_NUM_THREADS: "8"
    OMP_PLACES: "cores"
    OMP_PROC_BIND: "close"
  before_script:
    - |
      if [ "${CI_PIPELINE_SOURCE}" = "schedule" ]; then
        export BUILD_TYPE=Debug
      elif [ "${CI_COMMIT_REF_NAME}" = "develop" ]; then
        export BUILD_TYPE=Release
      else
        export BUILD_TYPE=RelWithDebInfo
      fi

.junit-artifacts:
  artifacts:
    when: always
    paths:
      - build/junit.xml
    reports:
      junit: build/junit.xml

NVIDIA-RTX5080:
  extends: [.common-setup, .junit-artifacts]
  tags: [uo-gpu, nvidia-rtx5080, x86_64-nvidiagpu]
  image: nvcr.io/nvidia/cuda:13.3.0-devel-ubuntu26.04
  timeout: 2h
  script:
    - apt-get update && apt-get install -y build-essential cmake git python3
    - export CMAKE_BUILD_PARALLEL_LEVEL=4
    - >-
      cmake -S ${CI_PROJECT_DIR} -B build
      -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
      -C ${CI_PROJECT_DIR}/host-configs/uoregon/nvidia_rtx5080.cmake
    - cmake --build build
    - ctest --test-dir build --output-on-failure --output-junit junit.xml

