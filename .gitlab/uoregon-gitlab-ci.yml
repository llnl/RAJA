INTEL-DATA-CENTER-MAX-1100:
  extends: [.common-setup, .junit-artifacts]
  tags: [uo-gpu, intel-data-center-max-1100, x86_64-intelgpu]
  image: intel/oneapi:2026.0.0-devel-ubuntu24.04
  timeout: 2h
  script:
    - apt-get update && apt-get install -y build-essential cmake git python3 intel-ocloc
    - sycl-ls
    - export ONEAPI_DEVICE_SELECTOR=level_zero:gpu
    - export CMAKE_BUILD_PARALLEL_LEVEL=8
    - >-
      cmake -S ${CI_PROJECT_DIR} -B build
      -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
      -C ${CI_PROJECT_DIR}/host-configs/uoregon/intel_pvc.cmake
    - cmake --build build
    - >-
      ctest --test-dir build --output-on-failure --output-junit junit.xml
      --exclude-regex 'test-forall-basic-msg-Sycl|test-tensor-register-double-Subtract'

AMD-MI300A:
  extends: [.common-setup, .junit-artifacts]
  tags: [uo-gpu, odyssey, amd-mi300, x86_64-amdgpu]
  image: rocm/dev-ubuntu-26.04:7.14.0-full
  timeout: 2h
  script:
    - apt-get update && apt-get install -y build-essential cmake git python3
    - export CMAKE_BUILD_PARALLEL_LEVEL=8
    - export HSA_XNACK=1
    - export HIP_VISIBLE_DEVICES=3
    - export LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:${LD_LIBRARY_PATH}
    - >-
      cmake -S ${CI_PROJECT_DIR} -B build
      -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
      -C ${CI_PROJECT_DIR}/host-configs/uoregon/amd_mi300a.cmake
    - cmake --build build
    - ctest --test-dir build --output-on-failure --output-junit junit.xml
